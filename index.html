<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Rigs</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<svg style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true">
  <defs>
    <symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/>
      <path d="M3 7l9 5 9-5"/>
      <path d="M12 12v10"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.3-4.3"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="9" cy="9" r="2"/>
      <path d="M21 15l-5-5L5 21"/>
    </symbol>
    <symbol id="i-wand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 4V2"/>
      <path d="M15 16v-2"/>
      <path d="M8 9h2"/>
      <path d="M20 9h2"/>
      <path d="M17.8 11.8L19 13"/>
      <path d="M17.8 6.2L19 5"/>
      <path d="M3 21l9-9"/>
      <path d="M12.2 6.2L11 5"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.4 2.6"/>
      <path d="M21 3v6h-6"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="M7 10l5 5 5-5"/>
      <path d="M12 15V3"/>
    </symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 15l6 6"/>
      <path d="M15 3l6 6"/>
      <path d="M3 9l6-6"/>
      <path d="M15 21l6-6"/>
    </symbol>
    <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8l-9-5-9 5 9 5 9-5z"/>
      <path d="M3 8v8l9 5 9-5V8"/>
      <path d="M12 13v8"/>
    </symbol>
    <symbol id="i-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3L2 21h20L12 3z"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6L6 18"/>
      <path d="M6 6l12 12"/>
    </symbol>
    <symbol id="i-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" opacity="0.3"/>
      <path d="M21 12a9 9 0 0 1-9 9"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"/>
      <rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/>
    </symbol>
  </defs>
</svg>

<div class="container">
  <div class="header">
    <div class="logo">
      <svg><use href="#i-cube"/></svg>
      <h1>Nova Rigs</h1>
    </div>
    <p class="sub">تکسچرت رو به مدل سه‌بعدی تبدیل کن</p>
  </div>

  <!-- ===== تب‌ها ===== -->
  <div class="tabs">
    <button class="tab active" data-tab="item">
      <svg><use href="#i-wand"/></svg>
      ریگ آیتم
    </button>
    <button class="tab" data-tab="block">
      <svg><use href="#i-box"/></svg>
      ریگ بلاک
    </button>
  </div>

  <!-- ===== تب ریگ آیتم ===== -->
  <div id="tab-item" class="tab-content active">
    <div class="panel">
      <div class="panel-title">
        <svg><use href="#i-search"/></svg>
        جستجوی تکسچر آیتم
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="مثلاً: diamond, sword, apple...">
        <button id="searchBtn" disabled>
          <svg><use href="#i-search"/></svg>
          جستجو
        </button>
      </div>
      <div class="results" id="results">
        <div class="no-result">
          <svg><use href="#i-search"/></svg>
          در حال لود تکسچرها...
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <svg><use href="#i-image"/></svg>
        تکسچر انتخاب‌شده
      </div>
      <div class="upload" onclick="document.getElementById('file').click()">
        <input type="file" id="file" accept="image/*">
        <div class="icon"><svg><use href="#i-image"/></svg></div>
        <div class="txt" id="uploadTxt">برای انتخاب تکسچر کلیک کن</div>
        <img id="preview">
      </div>

      <div class="settings">
        <div class="setting">
          <label>ضخامت <span class="val" id="tv">1.0</span></label>
          <input type="range" id="thick" min="0.1" max="3" step="0.1" value="1">
        </div>
        <div class="setting">
          <label>آستانه شفافیت <span class="val" id="av">128</span></label>
          <input type="range" id="alpha" min="0" max="255" value="128">
        </div>
        <div class="setting">
          <label>حداکثر ابعاد <span class="val" id="mv">64</span></label>
          <input type="range" id="maxs" min="16" max="256" step="16" value="64">
        </div>
      </div>

      <div class="btns">
        <button class="btn-p" id="conv" disabled>
          <svg><use href="#i-wand"/></svg>
          تبدیل
        </button>
        <button class="btn-s" id="rst" disabled>
          <svg><use href="#i-refresh"/></svg>
          ریست
        </button>
      </div>
      <div class="status" id="st">منتظر انتخاب تکسچر...</div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <svg><use href="#i-cube"/></svg>
        پیش‌نمایش سه‌بعدی
      </div>
      <div id="viewer"></div>
      <div class="info">
        <span><svg><use href="#i-ruler"/></svg> سایز: <b id="os">-</b></span>
        <span><svg><use href="#i-box"/></svg> ووکسل: <b id="vc">-</b></span>
        <span><svg><use href="#i-triangle"/></svg> وجه: <b id="fc">-</b></span>
      </div>
      <div class="btns">
        <button class="btn-p" id="dlZip" disabled>
          <svg><use href="#i-download"/></svg>
          دانلود پکیج (ZIP)
        </button>
      </div>
      <div class="hint">شامل: model.obj + model.mtl + texture.png</div>
    </div>
  </div>

  <!-- ===== تب ریگ بلاک ===== -->
  <div id="tab-block" class="tab-content">
    <div class="panel">
      <div class="panel-title">
        <svg><use href="#i-search"/></svg>
        جستجوی بلاک
      </div>
      <div class="search-box">
        <input type="text" id="blockSearchInput" placeholder="مثلاً: stone, furnace, grass...">
        <button id="blockSearchBtn" disabled>
          <svg><use href="#i-search"/></svg>
          جستجو
        </button>
      </div>
      <div class="block-grid" id="blockResults">
        <div class="no-result">
          <svg><use href="#i-grid"/></svg>
          در حال لود بلاک‌ها...
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="converter.js"></script>
<script src="search.js"></script>
<script src="block.js"></script>
<script src="tabs.js"></script>
</body>
</html>
